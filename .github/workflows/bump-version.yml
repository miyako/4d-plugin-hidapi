name: Bump

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic source version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: bump selected source branch
        env:
          MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/bump.py "$MODE" --sha "$GITHUB_SHA" --ref "$GITHUB_REF"
