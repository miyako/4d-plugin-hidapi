# Builds the plugin for Windows (x64) first, then macOS as a universal
# (arm64 + x86_64) binary, merges both into the single cross-platform
# .bundle, codesigns + notarizes the mac binary, and publishes a GitHub
# Release with the zip and dmg attached.
#
# NOTE: /test/ path is intentional and static for this project.
# Canonical layout enforced:
#   test/Plugins/<Product>.bundle/Contents/MacOS/<Product>
#   test/Plugins/<Product>.bundle/Contents/Windows64/<Product>.4DX

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ---- only this needs editing per-project ----
  PRODUCT_NAME: HIDAPI
  MACOS_DEPLOYMENT_TARGET: '10.13'
  # static base for this project (intentional)
  BASE_DIR: test
  # ---------------------------------------------

concurrency:
  group: hidapi-build-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: derive source version
        id: set
        run: |
          set -euo pipefail
          VERSION=$(python3 .github/scripts/source_version.py)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: authenticated publication preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py check --sha "$GITHUB_SHA"

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: clean stale outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python3 .github/scripts/native.py --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows output cleanup failed' }

      - name: build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: verify exact Windows output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = "${{ env.PRODUCT_NAME }}"
          $base = "${{ env.BASE_DIR }}"
          # vcxproj OutDir differs only in case on Windows.
          $binary = "$base/Plugins/$product.bundle/Contents/Windows64/$product.4DX"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing $binary" }
          if ((Get-Item -LiteralPath $binary).Length -le 0) { throw "Empty $binary" }

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.BASE_DIR }}/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: authenticated macOS publication preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py check --sha "$GITHUB_SHA"

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.BASE_DIR }}"
          XCODE_PROJECT="${PRODUCT}.xcodeproj"
          XCODE_TARGET="${PRODUCT}"
          PLUGINS_DIR="${BASE}/Plugins"

          python3 .github/scripts/native.py --platform macos

          echo "Building $XCODE_PROJECT target $XCODE_TARGET"
          xcodebuild -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/$PLUGINS_DIR" \
            build

      - name: verify universal binary and fresh metadata
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.BASE_DIR }}"
          BIN="${BASE}/Plugins/${PRODUCT}.bundle/Contents/MacOS/${PRODUCT}"

          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found at $BIN"
            ls -R "$BASE"
            exit 1
          fi

          echo "Timestamp check (must be recent):"
          ls -lT "$BIN" || ls -l --time-style=full "$BIN"

          lipo -info "$BIN"
          lipo -verify_arch arm64 x86_64 "$BIN"
          test -s "$BIN"
          python3 .github/scripts/source_version.py --verify-bundle "${BASE}/Plugins/${PRODUCT}.bundle"
          cmp manifest.json "${BASE}/Plugins/${PRODUCT}.bundle/Contents/Resources/manifest.json"
          cmp constants.xlf "${BASE}/Plugins/${PRODUCT}.bundle/Contents/Resources/constants.xlf"

      - name: merge Windows binaries into the bundle
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BASE="${{ env.BASE_DIR }}"
          BUNDLE="${BASE}/Plugins/${PRODUCT}.bundle"

          mkdir -p "$BUNDLE/Contents/Windows64"

          echo "winbuild contents:"
          ls -R winbuild
          SRC="winbuild/${PRODUCT}.4DX"
          test -s "$SRC"

          echo "Copying $SRC -> $BUNDLE/Contents/Windows64/${PRODUCT}.4DX"
          cp "$SRC" "$BUNDLE/Contents/Windows64/${PRODUCT}.4DX"

          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"
          ls -R "$BUNDLE/Contents"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          ZIP_PATH="${PRODUCT}-${VERSION}.zip"
          DMG_PATH="${PRODUCT}-${VERSION}.dmg"

          echo "Creating $ZIP_PATH"
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          echo "Creating $DMG_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$RUNNER_TEMP/zip-notary.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(d,dict) and d.get("status") == "Accepted" else "ZIP notarization not Accepted")' "$RUNNER_TEMP/zip-notary.json"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(d,dict) and d.get("status") == "Accepted" else "DMG notarization not Accepted")' "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -lh "$ZIP_PATH" "$DMG_PATH"

      - name: create new tag, release and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish --sha "$GITHUB_SHA" "$ZIP_PATH" "$DMG_PATH"
